# 推送 v* 标签时自动发布：测试 → 交叉编译 5 个平台 → 打包 → 创建 GitHub Release 并上传附件。
#
#   git tag -a v0.2.0 -m "Vinx Docs 0.2.0" && git push origin v0.2.0
#
# 发布说明取 CHANGELOG.md 里对应版本的一节（标题形如「## [0.2.0] - 日期」），找不到就用 GitHub 自动生成的说明。
# 同名 Release 已存在时只覆盖附件，不改说明。
# 手动运行（Actions 页面的 Run workflow）只做测试、编译和打包，产物作为构建产物保留 1 天，不创建 Release。
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 测试
        run: |
          go vet ./...
          go test -count=1 ./...

      - name: 确定版本号
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's/^var Version = "\(.*\)"$/\1/p' internal/cli/cli.go)-dev.${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: 编译与打包
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./scripts/build.sh all
          cd dist
          for f in vinx-docs-*; do
            case "$f" in
              *.exe) cp "$f" vinx-docs.exe && zip -q "${f%.exe}.zip" vinx-docs.exe && rm vinx-docs.exe ;;
              *) tar czf "$f.tar.gz" --transform "s#^$f\$#vinx-docs#" "$f" ;;
            esac
          done
          sha256sum *.tar.gz *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ./vinx-docs-linux-amd64 --version

      - name: 保留构建产物（手动运行时）
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: vinx-docs-${{ steps.version.outputs.version }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt
          retention-days: 1

      - name: 创建 Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          assets=(dist/*.tar.gz dist/*.zip dist/SHA256SUMS.txt)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
            exit 0
          fi
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [[ -s notes.md ]]; then
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --title "Vinx Docs $VERSION" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --title "Vinx Docs $VERSION" --generate-notes
          fi
