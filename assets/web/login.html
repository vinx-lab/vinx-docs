<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vinx Docs · 登录</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/assets/app.css">
  <script src="/assets/theme.js"></script>
  <script src="/assets/login.js" defer></script>
</head>
<body class="hub login">
  <main class="login-main">
    <p class="brand"><a href="/">Vinx Docs</a></p>
    <form id="login-form" class="admin-card login-card">
      <h1>登录</h1>
      <label for="password">访问密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button type="submit">登录</button>
      <p id="login-status" class="manage-status" role="status" aria-live="polite" hidden></p>
    </form>
    <p class="card-note">公开的项目和刚发布的短链接不登录也能阅读，<a href="/">返回文档中心</a>。</p>
  </main>
</body>
</html>
